name: Validate Commercial Catalog and Negative Cases

# Stdlib Python only; no setup or dependency install. Validation only:
# a passing run grants no payment, entitlement, pricing or runtime ALLOW.
on:
  pull_request:
    paths:
      - 'commercial/**'
      - '.github/workflows/commercial-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'commercial/**'
      - '.github/workflows/commercial-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Validate commercial catalog records
        run: python commercial/validate_catalog.py
      - name: Offline payment/entitlement negative cases
        run: python -m unittest discover -s commercial/tests -v
